name: Earnings after close

on:
  schedule:
    # Off-minute retries. Minute 0 is when GitHub schedule delays pile up.
    # 23:07–23:47 UTC Mon–Fri is 19:07–19:47 EDT (inside the window) and
    # 18:07–18:47 EST (script skips until 19:00 ET).
    - cron: "7,17,27,37,47 23 * * 1-5"
    # 00:07–01:47 UTC Tue–Sat is 20:07–21:47 EDT the previous weekday, or
    # 19:07–20:47 EST. Together with the 23:xx cron this covers the
    # [19:00, 22:00) ET scrape window in both EDT and EST.
    - cron: "7,17,27,37,47 0-1 * * 2-6"
  workflow_dispatch:
    inputs:
      mode:
        description: Fetch a fresh report or enrich the latest AM and BM using verified research
        type: choice
        options: [scrape, analyze]
        default: scrape

permissions:
  contents: write

concurrency:
  group: earnings-report-commit
  cancel-in-progress: false

jobs:
  scrape:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'analyze' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scraper dependencies
        run: python3 -m pip install 'requests>=2.31.0' tzdata
      - name: Scrape and commit the report
        env:
          # workflow_dispatch leaves this false and scrapes immediately.
          ENFORCE_SCHEDULE_WINDOW: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
        run: bash .github/scripts/commit-earnings-report.sh amc

  analyze:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'analyze' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install beautifulsoup4==4.14.2 tzdata
      - name: Calculate, enrich and validate latest AM and BM
        run: python3 analysis/enrich_reports.py
      - name: Commit analyzed reports to this branch
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add earnings_report_*.html analysis/*-validation.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Analyze latest AM and BM reports with verified IOMA and ERQI research"
          git push origin "HEAD:$TARGET_BRANCH"
