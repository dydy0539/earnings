name: Earnings after close

on:
  schedule:
    # GitHub delivers this repo's schedule events 2–4 hours late, and drops
    # some. 19:07–23:37 UTC Mon–Fri is 15:07–19:37 EDT or 14:07–18:37 EST;
    # starts before 19:00 ET sleep until the open (at most 5 hours).
    - cron: "7,37 19-23 * * 1-5"
    # 00:07–04:37 UTC Tue–Sat is 20:07 EDT until 00:37 EDT, or 19:07–23:37 EST,
    # of the previous weekday. Starts scrape until midnight ET unless a fresh
    # AM exists; anything past midnight ET is skipped.
    - cron: "7,37 0-4 * * 2-6"
  workflow_dispatch:
    inputs:
      mode:
        description: Fetch a fresh report or enrich the latest AM and BM using verified research
        type: choice
        options: [scrape, analyze]
        default: scrape

permissions:
  contents: write

concurrency:
  # One scheduled run sleeps or scrapes at a time; manual runs never queue behind it.
  group: earnings-after-close-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  scrape:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'analyze' }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scraper dependencies
        run: python3 -m pip install 'requests>=2.31.0' tzdata
      - name: Scrape and commit the report
        env:
          # workflow_dispatch leaves this false and scrapes immediately.
          ENFORCE_SCHEDULE_WINDOW: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
        run: bash .github/scripts/commit-earnings-report.sh amc

  analyze:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'analyze' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install beautifulsoup4==4.14.2 tzdata
      - name: Calculate, enrich and validate latest AM and BM
        run: python3 analysis/enrich_reports.py
      - name: Commit analyzed reports to this branch
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add earnings_report_*.html analysis/*-validation.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Analyze latest AM and BM reports with verified IOMA and ERQI research"
          git push origin "HEAD:$TARGET_BRANCH"
