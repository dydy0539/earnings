name: Earnings before open

on:
  schedule:
    # GitHub delays and sometimes drops minute-0 crons, so retry off :00.
    # 12:07–14:47 UTC Mon–Fri is 08:07–10:47 EDT. During EST the same cron is
    # 07:07–09:47 ET; the script skips anything before 08:00 ET, leaving
    # 08:07–09:47 EST. The scrape window itself is [08:00, 11:00) ET.
    - cron: "7,17,27,37,47 12-14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: earnings-report-commit
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scraper dependencies
        run: python3 -m pip install 'requests>=2.31.0' tzdata
      - name: Scrape and commit the report
        env:
          # workflow_dispatch leaves this false and scrapes immediately.
          ENFORCE_SCHEDULE_WINDOW: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
        run: bash .github/scripts/commit-earnings-report.sh bmo
