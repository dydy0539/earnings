name: Earnings before open

on:
  schedule:
    # GitHub delivers this repo's schedule events 2–4 hours late, and drops
    # some. 08:07–20:37 UTC Mon–Fri is 04:07–16:37 EDT or 03:07–15:37 EST.
    # Starts before 08:00 ET sleep until the open (at most 5 hours); later
    # starts scrape until the 16:00 ET cutoff unless a fresh BM exists.
    - cron: "7,37 8-20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # One scheduled run sleeps or scrapes at a time; manual runs never queue behind it.
  group: earnings-before-open-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scraper dependencies
        run: python3 -m pip install 'requests>=2.31.0' tzdata
      - name: Scrape and commit the report
        env:
          # workflow_dispatch leaves this false and scrapes immediately.
          ENFORCE_SCHEDULE_WINDOW: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
        run: bash .github/scripts/commit-earnings-report.sh bmo
